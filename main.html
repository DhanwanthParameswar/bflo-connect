<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elevator — Match with Buffalo Startups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Best-effort match to 43North's institutional navy + gold identity —
       swap these once exact brand hex values / logo assets are shared. */
    --ink:#0F1E3D;
    --ink-soft:#1B2C52;
    --paper:#F4F5F2;
    --paper-raised:#FFFFFF;
    --amber:#F0A836;
    --amber-deep:#D68A16;
    --rust:#BE4F30;
    --pine:#2F6B4F;
    --pine-soft:#DEEAE1;
    --rust-soft:#F3DCD3;
    --mist:#CDD3DE;
    --muted:#5B6472;
    --line:#DEE1DA;
    --navy-soft:#E7EBF3;
    --shadow: 0 18px 40px -12px rgba(15,30,61,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Bricolage Grotesque',sans-serif;}

  /* ===== App shell ===== */
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
    background:var(--paper);
  }

  /* ===== Header ===== */
  header.top{
    padding:18px 18px 12px;
    position:sticky;
    top:0;
    z-index:30;
    background:linear-gradient(180deg, var(--paper) 78%, rgba(238,242,236,0));
  }
  .brandrow{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:2px;
  }
  .wordmark{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:-0.5px;
    color:var(--ink);
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .wordmark .dot{color:var(--amber-deep);}
  .savedbtn{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:100px;
    padding:8px 14px;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .savedbtn:hover{transform:translateY(-1px);}
  .savedbtn .n{
    background:var(--amber);
    color:var(--ink);
    border-radius:100px;
    padding:1px 7px;
    font-size:11.5px;
  }
  .tagline{
    font-size:13px;
    color:var(--muted);
    margin:2px 0 12px;
  }

  /* mode toggle: talent vs company */
  .modetoggle{
    display:flex;
    background:var(--navy-soft);
    border-radius:100px;
    padding:3px;
    margin-bottom:14px;
  }
  .modetoggle .modebtn{
    flex:1;
    text-align:center;
    padding:9px 6px;
    border-radius:100px;
    font-size:12.5px;
    font-weight:700;
    font-family:'JetBrains Mono',monospace;
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .2s ease;
  }
  .modetoggle .modebtn.on{
    background:var(--ink);
    color:var(--paper);
    box-shadow:0 4px 12px -4px rgba(15,30,61,0.5);
  }

  /* sub-nav (Home / Discover) for talent mode */
  .subnav{
    display:flex;
    gap:6px;
    margin-bottom:14px;
  }
  .subnav .subbtn{
    padding:7px 15px;
    border-radius:100px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .subnav .subbtn.on{
    background:var(--amber);
    border-color:var(--amber);
    color:var(--ink);
  }

  /* stat strip */
  .statstrip{
    display:flex;
    gap:14px;
    margin-bottom:14px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .stat{flex:1;}
  .stat .v{
    font-family:'JetBrains Mono',monospace;
    font-weight:600;
    font-size:17px;
    color:var(--ink);
  }
  .stat .l{
    font-size:10.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-top:1px;
  }

  /* controls */
  .controls{display:flex; flex-direction:column; gap:10px;}
  .searchrow{display:flex; gap:8px;}
  .searchbox{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:9px 12px;
  }
  .searchbox input{
    border:none;
    outline:none;
    background:transparent;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    width:100%;
    color:var(--ink);
  }
  .searchbox svg{flex-shrink:0; opacity:0.55;}
  .locbtn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:0 14px;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
    font-family:'JetBrains Mono',monospace;
  }
  .locbtn.active{background:var(--pine); color:#fff; border-color:var(--pine);}

  .chiprow{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    padding:6px 12px;
    border-radius:100px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .sortrow{display:flex; gap:6px; align-items:center; font-size:12px;}
  .sortlabel{color:var(--muted); margin-right:2px; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.5px;}

  /* ===== Stage / card stack ===== */
  .stage{
    flex:1;
    position:relative;
    padding:6px 18px 10px;
    display:flex;
    flex-direction:column;
    min-height:520px;
  }
  .deck{
    position:relative;
    flex:1;
    min-height:460px;
  }
  .card{
    position:absolute;
    inset:0;
    background:var(--paper-raised);
    border-radius:26px;
    box-shadow:var(--shadow);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    cursor:grab;
    user-select:none;
    touch-action:none;
    border:1px solid rgba(18,35,43,0.05);
  }
  .card .glow{
    position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle at 85% -10%, rgba(227,160,60,0.20), transparent 55%);
  }
  .card-top{
    padding:22px 22px 0;
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .logo-wrap{
    width:56px; height:56px;
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    flex-shrink:0;
  }
  .logo-wrap img{width:100%; height:100%; object-fit:contain; padding:5px;}
  .brand-ring{
    width:100%; height:100%;
    border-radius:inherit;
    padding:3px;
    display:flex;
  }
  .logo-inner{
    width:100%; height:100%;
    background:#fff;
    border-radius:inherit;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .logo-inner img{width:100%; height:100%; object-fit:contain; padding:5px;}
  .logo-fallback{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800; font-size:15px; color:var(--ink);
  }
  .logo-fallback{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800; font-size:19px; color:var(--ink);
  }
  .card-heading{flex:1; min-width:0;}
  .card-role{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:700;
    font-size:21px;
    line-height:1.15;
    color:var(--ink);
  }
  .card-company{
    font-size:13px;
    color:var(--amber-deep);
    font-weight:600;
    margin-top:2px;
  }
  .card-meta{
    display:flex; gap:10px; flex-wrap:wrap;
    padding:12px 22px 0;
    font-size:11.5px;
    color:var(--muted);
  }
  .card-meta span{display:flex; align-items:center; gap:4px;}
  .card-pitch{
    padding:14px 22px 0;
    font-size:14px;
    line-height:1.5;
    color:var(--ink-soft);
    flex:1;
  }
  .card-tags{
    display:flex; gap:6px; flex-wrap:wrap; padding:14px 22px 0;
  }
  .tagchip{
    font-size:10.5px;
    font-weight:600;
    padding:4px 9px;
    border-radius:100px;
    background:var(--pine-soft);
    color:var(--pine);
  }
  .card-bottom{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 22px 20px;
    border-top:1px solid var(--line);
  }
  .growth-mini{display:flex; align-items:center; gap:8px;}
  .growth-label{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; font-family:'JetBrains Mono',monospace;}
  .growth-value{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px;}
  .growth-value.up{color:var(--pine);}
  .growth-value.down{color:var(--rust);}
  .tapexpand{
    font-size:11px;
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    display:flex; align-items:center; gap:4px;
  }

  /* swipe stamp */
  .stamp{
    position:absolute;
    top:34px;
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800;
    font-size:30px;
    letter-spacing:2px;
    padding:6px 16px;
    border-radius:10px;
    border:4px solid;
    transform:rotate(-14deg);
    opacity:0;
    pointer-events:none;
    text-transform:uppercase;
  }
  .stamp.save{left:24px; color:var(--pine); border-color:var(--pine);}
  .stamp.pass{right:24px; color:var(--rust); border-color:var(--rust); transform:rotate(14deg);}

  /* swipe / scroll-feed toggle */
  .viewtoggle{
    display:flex; gap:6px;
    margin-bottom:10px;
  }
  .viewtoggle .vtbtn{
    flex:1; text-align:center;
    padding:8px 6px;
    border-radius:100px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    font-size:12px; font-weight:700;
    font-family:'JetBrains Mono',monospace;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .viewtoggle .vtbtn.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  /* vertical scroll feed — TikTok/Reels-style browsing, no swipe gesture needed */
  .feedwrap{
    height:100%;
    overflow-y:auto;
    scroll-snap-type:y mandatory;
    border-radius:26px;
    scrollbar-width:none;
  }
  .feedwrap::-webkit-scrollbar{display:none;}
  .feedcard{
    height:100%;
    min-height:460px;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    background:var(--paper-raised);
    border-radius:26px;
    border:1px solid rgba(18,35,43,0.05);
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    margin-bottom:14px;
  }
  .feedcard:last-child{margin-bottom:0;}
  .feedrail{
    position:absolute;
    right:14px; bottom:110px;
    display:flex; flex-direction:column; gap:12px;
    z-index:5;
  }
  .feedactionbtn{
    width:48px; height:48px;
    border-radius:50%;
    background:rgba(255,255,255,0.92);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 8px 18px -6px rgba(18,35,43,0.3);
    transition:transform .12s ease;
  }
  .feedactionbtn:hover{transform:scale(1.08);}
  .feedactionbtn:active{transform:scale(0.94);}
  .feedactionbtn.pass{color:var(--rust);}
  .feedactionbtn.save{color:var(--pine);}
  .feedactionbtn.info{width:38px; height:38px; color:var(--amber-deep); margin:0 auto;}
  .feedscrollhint{
    position:absolute; top:14px; right:18px;
    background:rgba(15,30,61,0.55);
    color:#fff;
    font-family:'JetBrains Mono',monospace;
    font-size:10px; font-weight:700;
    padding:5px 10px; border-radius:100px;
    z-index:5;
    animation:feedbounce 1.6s ease-in-out infinite;
  }
  @keyframes feedbounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(4px);} }

  /* action buttons */
  .actions{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:16px 0 4px;
  }
  .actionbtn{
    width:56px; height:56px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--paper-raised);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 8px 18px -8px rgba(18,35,43,0.25);
    transition:transform .12s ease;
  }
  .actionbtn:hover{transform:translateY(-2px) scale(1.04);}
  .actionbtn.pass{color:var(--rust);}
  .actionbtn.save{color:var(--pine);}
  .actionbtn.info{width:44px; height:44px; color:var(--amber-deep);}

  .empty-state{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:10px; padding:40px;
    color:var(--muted);
  }
  .empty-state .silo-icon{margin-bottom:6px;}
  .empty-state h3{font-family:'Bricolage Grotesque',sans-serif; color:var(--ink); font-size:19px; margin:0;}
  .resetbtn{
    margin-top:10px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:10px 18px;
    border-radius:100px;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }

  /* ===== Profile sheet ===== */
  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(18,35,43,0.45);
    backdrop-filter:blur(2px);
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translate(-50%, 100%);
    width:100%;
    max-width:520px;
    max-height:92vh;
    background:var(--paper);
    border-radius:28px 28px 0 0;
    z-index:101;
    display:flex;
    flex-direction:column;
    transition:transform .32s cubic-bezier(.22,.9,.3,1);
    box-shadow:0 -20px 60px rgba(18,35,43,0.35);
  }
  .sheet.open{transform:translate(-50%,0%);}
  .sheet-grip{
    width:40px; height:4px; background:var(--mist); border-radius:100px;
    margin:10px auto 4px;
    flex-shrink:0;
  }
  .sheet-scroll{
    overflow-y:auto;
    padding:6px 24px 28px;
    flex:1;
  }
  .sheet-close{
    position:absolute;
    top:14px; right:16px;
    width:32px; height:32px;
    border-radius:50%;
    background:var(--paper-raised);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:5;
  }
  .p-cover{
    height:84px;
    border-radius:20px 20px 0 0;
    margin:-6px -24px 0;
  }
  .p-header{
    display:flex; gap:14px; align-items:flex-end;
    padding-top:0;
    margin:-40px 0 6px;
  }
  .p-logo{
    width:72px; height:72px; border-radius:18px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    flex-shrink:0;
    box-shadow:0 6px 18px -4px rgba(15,30,61,0.35);
  }
  .p-logo img{width:100%; height:100%; object-fit:contain; padding:6px;}
  .p-name{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:23px; color:var(--ink); line-height:1.1;}
  .p-sub{font-size:12.5px; color:var(--muted); margin-top:3px;}
  .p-roles{display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 4px;}
  .rolechip{
    background:var(--ink); color:var(--paper);
    font-size:11.5px; font-weight:600;
    padding:6px 12px; border-radius:100px;
    font-family:'JetBrains Mono',monospace;
  }
  .p-note{
    font-size:11px; color:var(--muted); font-style:italic; margin:6px 0 16px;
  }

  .p-section{margin-top:22px;}
  .p-section h4{
    font-family:'JetBrains Mono',monospace;
    text-transform:uppercase;
    letter-spacing:0.6px;
    font-size:11px;
    color:var(--amber-deep);
    margin:0 0 8px;
    display:flex; align-items:center; gap:6px;
  }
  .p-body-text{font-size:14px; line-height:1.55; color:var(--ink-soft);}

  /* Silo gauge big */
  .silo-block{
    display:flex; gap:18px; align-items:center;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px;
  }
  .silo-stats{flex:1; display:flex; flex-direction:column; gap:10px;}
  .silo-row{display:flex; justify-content:space-between; align-items:baseline;}
  .silo-row .k{font-size:11.5px; color:var(--muted);}
  .silo-row .v{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px;}
  .silo-row .v.up{color:var(--pine);}
  .silo-row .v.down{color:var(--rust);}

  .p-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .infobox{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:11px 13px;
  }
  .infobox .k{font-size:10px; text-transform:uppercase; letter-spacing:0.4px; color:var(--muted); font-family:'JetBrains Mono',monospace;}
  .infobox .v{font-size:13.5px; font-weight:600; color:var(--ink); margin-top:3px; line-height:1.3;}

  .chipwrap{display:flex; gap:6px; flex-wrap:wrap;}
  .infochip{
    font-size:11.5px; padding:5px 10px; border-radius:100px;
    background:var(--pine-soft); color:var(--pine); font-weight:600;
  }
  .infochip.tech{background:#DEE6EF; color:#2E4C6D;}
  .infochip.investor{background:#F1E7D2; color:#8A6318;}
  .infochip.round{background:var(--rust-soft); color:var(--rust);}

  .story-box{
    background:var(--ink);
    color:var(--paper);
    border-radius:16px;
    padding:16px;
    font-size:13.5px;
    line-height:1.55;
  }
  .story-box h4{color:var(--amber);}

  .p-cta{
    display:flex; gap:10px; margin-top:26px;
  }
  .btn-primary{
    flex:1;
    background:var(--pine);
    color:#fff;
    border:none;
    padding:14px;
    border-radius:14px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-secondary{
    background:var(--paper-raised);
    border:1px solid var(--line);
    color:var(--ink);
    padding:14px 18px;
    border-radius:14px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }

  /* Saved drawer */
  .drawer-backdrop{
    position:fixed; inset:0; background:rgba(18,35,43,0.45);
    z-index:100; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .drawer-backdrop.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; right:0; bottom:0;
    width:88%; max-width:400px;
    background:var(--paper);
    z-index:101;
    transform:translateX(100%);
    transition:transform .3s cubic-bezier(.22,.9,.3,1);
    display:flex; flex-direction:column;
    box-shadow:-20px 0 50px rgba(18,35,43,0.3);
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    padding:20px 20px 12px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .drawer-head h3{font-family:'Bricolage Grotesque',sans-serif; margin:0; font-size:19px;}
  .drawer-list{flex:1; overflow-y:auto; padding:10px 16px 20px;}
  .savedrow{
    display:flex; gap:12px; align-items:center;
    padding:10px; border-radius:14px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .savedrow:hover{background:var(--paper-raised);}
  .savedrow .sl{width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;}

  /* ===== Home view ===== */

    padding:20px;

    display:flex;

    justify-content:space-between;
    background:var(--paper-raised);

    color:var(--amber-deep);

  .rail{margin-bottom:26px;}
  .rail-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;

    font-family:'Bricolage Grotesque',sans-serif;

    margin:0;
    color:var(--ink);
  }

  .rail-scroll{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding-bottom:6px;
    margin:0 -18px;
    padding-left:18px;
    padding-right:18px;

    scroll-snap-type:x mandatory;
    scroll-padding-left:18px;
  }
  .rail-scroll::-webkit-scrollbar{display:none;}
  .railcard{
    flex-shrink:0;

  }
  .railcard:hover{transform:translateY(-3px);}
  .railcard:active{transform:scale(0.97);}
  .railcard .rc-top{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .railcard .rc-logo{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;}
  .railcard .rc-logo img{width:100%; height:100%; object-fit:contain; padding:3px;}
  .railcard .rc-name{font-size:12.5px; font-weight:700; color:var(--ink); line-height:1.2;}
  .railcard .rc-role{font-size:11px; color:var(--amber-deep); font-weight:600; margin-top:1px;}
  .railcard .rc-meta{font-size:11px; color:var(--muted); margin-bottom:8px; line-height:1.4;}
  .railcard .rc-foot{display:flex; align-items:center; justify-content:space-between;}
  .railcard .rc-why{
    font-size:9.5px;
    background:var(--pine-soft);
    color:var(--pine);
    padding:3px 8px;
    border-radius:100px;

  }
  .cta-swipe{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    background:var(--ink);
    color:var(--paper);

    padding:15px;
    border-radius:16px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    margin-top:6px;

  /* ===== Company view ===== */
  .companywrap{padding:4px 18px 30px;}
  .company-search{
    position:relative;
    margin-bottom:16px;
  }
  .company-search input{
    width:100%;
    padding:13px 16px;
    border-radius:14px;
    border:1px solid var(--line);

  .ac-row .acl img{width:100%; height:100%; object-fit:contain;}

  .company-empty{
    text-align:center;

  .selected-company{
    display:flex; align-items:center; gap:14px;
    background:var(--ink);
    color:var(--paper);
    border-radius:20px;

  }

  .selected-company .sc-logo img{width:100%; height:100%; object-fit:contain; padding:5px;}
  .selected-company .sc-name{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:17px;}
  .selected-company .sc-meta{font-size:11.5px; color:#B9C2D6; margin-top:2px;}
  .selected-company .sc-change{
    margin-left:auto;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--amber);
    cursor:pointer;
    font-weight:700;
    white-space:nowrap;
  }

  .benchmark-box{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px;
    margin-bottom:22px;
  }
  .benchmark-box h4{
    font-family:'JetBrains Mono',monospace;
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:0.5px;
    color:var(--amber-deep);
    margin:0 0 12px;
  }
  .bm-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .bm-row .bm-label{width:92px; font-size:11.5px; color:var(--muted); flex-shrink:0;}
  .bm-row .bm-track{flex:1; height:8px; border-radius:100px; background:var(--paper); overflow:hidden; position:relative;}
  .bm-row .bm-fill{height:100%; border-radius:100px; position:absolute; left:0;}
  .bm-row .bm-val{width:52px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; flex-shrink:0;}

  .partner-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:18px;
    padding:15px;
    margin-bottom:12px;
    cursor:pointer;
    display:flex;
    gap:12px;
  }
  .partner-card:hover{border-color:var(--amber);}
  .partner-card .pc-logo{width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;}
  .partner-card .pc-logo img{width:100%; height:100%; object-fit:contain; padding:4px;}
  .partner-card .pc-name{font-weight:700; font-size:14px; color:var(--ink);}
  .partner-card .pc-desc{font-size:12px; color:var(--muted); margin:3px 0 8px; line-height:1.4;}
  .partner-card .pc-reasons{display:flex; gap:5px; flex-wrap:wrap;}
  .reasonchip{
    font-size:10px; font-weight:600;
    padding:3px 8px; border-radius:100px;
    background:var(--navy-soft); color:var(--ink-soft);
  }

  /* ===== Landing / persona chooser ===== */
  .landingwrap{padding:10px 18px 40px;}
  .landing-hero{
    text-align:center;
    padding:18px 6px 26px;
  }
  .landing-hero .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--amber-deep);
    font-weight:700;
    margin-bottom:8px;
  }
  .landing-hero h1{
    font-family:'Bricolage Grotesque',sans-serif;
    font-size:30px;
    line-height:1.12;
    color:var(--ink);
    margin:0 0 10px;
  }
  .landing-hero p{
    font-size:13.5px;
    color:var(--muted);
    max-width:340px;
    margin:0 auto;
  }
  .persona-cards{display:flex; flex-direction:column; gap:14px; margin-top:22px;}
  .persona-card{
    border-radius:22px;
    padding:22px;
    cursor:pointer;
    transition:transform .18s ease;
    position:relative;
    overflow:hidden;
  }
  .persona-card:hover{transform:translateY(-3px);}
  .persona-card.seeker{background:linear-gradient(135deg, var(--ink) 0%, #23386B 100%); color:#fff;}
  .persona-card.company{background:var(--paper-raised); border:1.5px solid var(--ink); color:var(--ink);}
  .persona-card .pcard-icon{font-size:26px; margin-bottom:10px; display:block;}
  .persona-card h3{font-family:'Bricolage Grotesque',sans-serif; font-size:19px; margin:0 0 5px;}
  .persona-card p{font-size:12.5px; margin:0 0 14px; opacity:0.85; max-width:280px;}
  .persona-card .go{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700;
  }
  .persona-card.seeker .go{color:var(--amber);}
  .persona-card.company .go{color:var(--amber-deep);}
  .landing-stats{
    display:flex; justify-content:center; gap:22px;
    margin-top:26px; padding-top:20px; border-top:1px solid var(--line);
  }
  .landing-stats .ls{text-align:center;}
  .landing-stats .ls .v{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; color:var(--ink);}
  .landing-stats .ls .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px;}

  .switchlink{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; font-weight:700;
    color:var(--muted);
    cursor:pointer;
    display:inline-flex; align-items:center; gap:4px;
    margin-bottom:14px;
  }
  .switchlink:hover{color:var(--amber-deep);}

  /* page hero banners (dedicated feel) */
  .page-hero{
    border-radius:22px;
    padding:20px;
    margin-bottom:22px;
  }
  .page-hero.seeker{background:linear-gradient(135deg, var(--amber) 0%, #F0BE68 100%); color:var(--ink);}
  .page-hero.company{background:var(--ink); color:#fff;}
  .page-hero h2{font-family:'Bricolage Grotesque',sans-serif; font-size:21px; margin:0 0 4px;}
  .page-hero p{font-size:12.5px; margin:0; opacity:0.85; max-width:320px;}
  .page-hero .hero-stats{display:flex; gap:18px; margin-top:14px;}
  .page-hero .hero-stats .v{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px;}
  .page-hero .hero-stats .l{font-size:9.5px; text-transform:uppercase; letter-spacing:0.4px; opacity:0.75;}

  /* filter button + modal */
  .filterbtn{
    width:38px; flex-shrink:0;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    font-size:15px;
    cursor:pointer;
  }
  .filter-backdrop{
    position:fixed; inset:0; background:rgba(15,30,61,0.45);
    z-index:150; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .filter-backdrop.open{opacity:1; pointer-events:auto;}
  .filter-modal{
    position:fixed; left:50%; bottom:0; transform:translate(-50%,100%);
    width:100%; max-width:520px; max-height:80vh;
    background:var(--paper); border-radius:26px 26px 0 0;
    z-index:151; display:flex; flex-direction:column;
    transition:transform .3s cubic-bezier(.22,.9,.3,1);
    box-shadow:0 -20px 50px rgba(15,30,61,0.3);
  }
  .filter-modal.open{transform:translate(-50%,0);}
  .fm-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 10px;
    border-bottom:1px solid var(--line);
  }
  .fm-head h3{font-family:'Bricolage Grotesque',sans-serif; margin:0; font-size:18px;}
  .fm-body{padding:16px 20px 24px; overflow-y:auto;}
  .fm-group{margin-bottom:18px;}
  .fm-group .lbl{font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px; color:var(--amber-deep); margin-bottom:8px;}
  .fm-slider-row{display:flex; align-items:center; gap:10px;}
  .fm-slider-row input[type=range]{flex:1; accent-color:var(--amber-deep);}
  .fm-slider-row .val{font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:700; width:56px; text-align:right;}
  .fm-apply{
    width:100%; background:var(--ink); color:var(--paper); border:none;
    padding:13px; border-radius:14px; font-weight:700; font-size:13.5px; cursor:pointer; margin-top:4px;
  }
  .fm-reset{
    width:100%; background:none; border:none; color:var(--muted);
    padding:8px; font-size:12px; cursor:pointer; text-decoration:underline;
  }

  /* undo action button */
  .actionbtn.undo{width:42px; height:42px; color:var(--muted); opacity:0.55; cursor:not-allowed;}
  .actionbtn.undo.active{opacity:1; cursor:pointer; color:var(--ink-soft);}

  /* compatibility ring */
  .matchring{position:relative; width:40px; height:40px; flex-shrink:0;}
  .matchring svg{transform:rotate(-90deg);}
  .matchring .mr-pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; color:var(--ink);
  }
  .card-topline{display:flex; align-items:center; justify-content:space-between; padding:16px 22px 0;}

  .shared-badges{display:flex; gap:5px; flex-wrap:wrap; padding:0 22px;}
  .sharedbadge{
    font-size:10px; font-weight:700;
    padding:4px 9px; border-radius:100px;
    background:#FBEFD9; color:var(--amber-deep);
    display:flex; align-items:center; gap:3px;
  }
  .vibebadge{
    font-size:10px; font-weight:700;
    padding:4px 9px; border-radius:100px;
    background:#F0E4F5; color:#8347A3;
    display:flex; align-items:center; gap:3px;
  }

  /* match celebration overlay */
  .match-overlay{
    position:fixed; inset:0; z-index:180;
    background:radial-gradient(circle at 50% 30%, rgba(240,168,54,0.97), rgba(15,30,61,0.97));
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
    text-align:center; padding:30px;
  }
  .match-overlay.show{opacity:1; pointer-events:auto;}
  .match-overlay .mo-title{
    font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:34px;
    color:#fff; margin-bottom:6px; letter-spacing:-0.5px;
  }
  .match-overlay .mo-sub{color:#fff; opacity:0.85; font-size:13px; margin-bottom:22px;}
  .match-overlay .mo-logo{
    width:88px; height:88px; border-radius:22px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    margin-bottom:16px; box-shadow:0 10px 30px rgba(0,0,0,0.3);
  }
  .match-overlay .mo-name{color:#fff; font-weight:700; font-size:16px; margin-bottom:4px;}
  .match-overlay .mo-role{color:#fff; opacity:0.85; font-size:12.5px; margin-bottom:24px;}
  .match-overlay .mo-actions{display:flex; gap:10px; width:100%; max-width:280px;}
  .match-overlay .mo-btn{
    flex:1; padding:13px; border-radius:100px; border:none; font-weight:700; font-size:13px; cursor:pointer;
  }
  .match-overlay .mo-btn.primary{background:#fff; color:var(--ink);}
  .match-overlay .mo-btn.secondary{background:rgba(255,255,255,0.15); color:#fff;}

  /* bumble-style prompt cards */
  .prompt-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:16px;
    padding:14px; margin-bottom:10px;
  }
  .prompt-card .pq{font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px; color:var(--amber-deep); margin-bottom:6px;}
  .prompt-card .pa{font-size:14px; color:var(--ink); font-weight:600; line-height:1.4;}
  .prompt-card.vibe .pq{color:#8347A3;}
  .prompt-card.vibe{background:#FAF5FC; border-color:#EAD9F2;}

  /* ===== suggested opener message block ===== */
  .opener-block{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
    margin-top:12px;
    text-align:left;
  }
  .opener-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .opener-head span{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px;
    color:var(--amber-deep); font-weight:700;
  }
  .opener-regen{
    background:none; border:none; color:var(--muted);
    font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700;
    cursor:pointer; padding:2px;
  }
  .opener-regen:hover{color:var(--ink);}
  .opener-text{
    font-size:13.5px; line-height:1.5; color:var(--ink-soft);
    min-height:38px;
    margin-bottom:10px;
    white-space:pre-wrap;
  }
  .opener-text.loading{color:var(--muted); font-style:italic;}
  .opener-copy{
    width:100%;
    background:var(--ink); color:var(--paper);
    border:none; padding:10px; border-radius:10px;
    font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .opener-copy.copied{background:var(--pine);}

  /* dark-background variant, used inside the match overlay */
  .match-overlay .opener-block{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    width:100%; max-width:320px;
    margin-bottom:16px;
  }
  .match-overlay .opener-head span{color:#fff;}
  .match-overlay .opener-text{color:#fff;}
  .match-overlay .opener-regen{color:rgba(255,255,255,0.7);}
  .match-overlay .opener-regen:hover{color:#fff;}
  .match-overlay .opener-copy{background:#fff; color:var(--ink);}
  .match-overlay .opener-copy.copied{background:var(--pine); color:#fff;}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brandrow">
      <div class="wordmark">ELEVATOR<span class="dot">.</span></div>
      <button class="savedbtn" id="savedBtn">
        ♥ MATCHES <span class="n" id="savedCount">0</span>
      </button>
    </div>
    <div class="tagline" id="taglineText">Buffalo & WNY's startup matchmaker.</div>

    <div class="subnav" id="seekerSubnav" style="display:none;">
      <div class="subbtn on" data-view="home">Home</div>
      <div class="subbtn" data-view="discover">Discover</div>
    </div>

    <div id="discoverControls" style="display:none;">
      <div class="statstrip" id="statStrip"></div>
      <div class="controls">
        <div class="searchrow">
          <div class="searchbox">

/* ---------- helpers ---------- */
function haversine(lat1,lon1,lat2,lon2){
  const R=3958.8;
  const dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function fmtPct(v){ if(v==null) return '—'; return (v>0?'+':'')+Math.round(v*100)+'%'; }
function fmtNum(v){ if(v==null) return '—'; return v.toLocaleString(); }
function esc(s){ if(s==null) return ''; return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function initials(name){ return name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase(); }

function siloSVG(cagr, size){
  // size: 'mini' or 'big'
  const val = cagr==null ? 0 : Math.max(-0.3, Math.min(0.6, cagr));
  const pct = (val + 0.3) / 0.9; // normalize -0.3..0.6 to 0..1
  const positive = (cagr==null) ? true : cagr >= 0;
  const color = positive ? 'var(--pine)' : 'var(--rust)';
  const w = size==='big' ? 46 : 22, h = size==='big' ? 64 : 30;
  const fillH = Math.max(4, pct * (h-14));
  return `
  <svg width="${w}" height="${h}" viewBox="0 0 46 64" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
    <rect x="8" y="8" width="30" height="52" rx="10" fill="none" stroke="var(--line)" stroke-width="3"/>
    <path d="M13 8 Q23 -4 33 8" fill="none" stroke="var(--line)" stroke-width="3"/>
    <clipPath id="clip-${Math.random().toString(36).slice(2)}"><rect x="8" y="8" width="30" height="52" rx="10"/></clipPath>
    <rect x="9" y="${60-fillH}" width="28" height="${fillH}" fill="${color}" opacity="0.85"/>
    <path d="M13 8 Q23 -4 33 8" fill="none" stroke="var(--line)" stroke-width="3"/>
  </svg>`;
}

function teamSignFor(company){
  const h = Math.abs((company.id * 2654435761) % 2147483647);

  if(!userProfile.zodiac) return null;

function matchRingSVG(pct){
  const r=16, circ=2*Math.PI*r;

  const color = pct>=70 ? 'var(--pine)' : pct>=45 ? 'var(--amber-deep)' : 'var(--rust)';

/* ============================================================
   MATCH MESSAGE DRAFTING
   Tries a live Claude call for a genuinely human-sounding opener;
   falls back to hand-written casual templates if that call fails
   (offline, rate-limited, etc.) so the feature never breaks.
   ============================================================ */
const OPENER_SYSTEM_PROMPT = `You write short first messages that a college student or early-career job seeker sends to a startup right after "matching" with them on a job-discovery app styled like a dating app.

Tone: friendly and genuine, but still professional — think a well-written LinkedIn message, not a text to a friend and not a formal cover letter. Warm, not stiff. Polished, not slangy.

Never use: "Dear", "I hope this message finds you well", "I am writing to express my interest", "I came across your company", exclamation-point overload, corporate buzzwords ("synergy", "leverage", "passionate about"), generic flattery ("your impressive company"), or a stiff sign-off like "Best regards".

Also avoid the opposite extreme: no lowercase-only texting style, no slang ("hey", "no cap", "lol"), no overly casual openers.

Do: start with a friendly greeting ("Hi!" or "Hello!"), reference exactly one specific, concrete detail from what's given (the role, a growth stat, a shared interest, the industry — pick whichever is most specific), use complete sentences with natural contractions, keep it to 2-3 sentences, and end with a low-pressure, genuine question rather than a hard call to action.

Output ONLY the message text. No preamble, no quotation marks, no labels.`;

async function draftOpenerViaAPI(context){
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 300,
      system: OPENER_SYSTEM_PROMPT,
      messages: [{ role: 'user', content: JSON.stringify(context) }]
    })
  });
  if(!resp.ok) throw new Error('bad status '+resp.status);
  const data = await resp.json();
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
  if(!text) throw new Error('empty response');
  return text;
}

const OPENER_TEMPLATES = [
  ctx => `Hi! I just matched with ${ctx.company} and wanted to reach out — ${ctx.one_liner ? ctx.one_liner.replace(/\.$/,'').toLowerCase() : 'what you all are building'} really stood out to me. Is the ${ctx.role} role still open?`,
  ctx => `Hello! I matched with your team and wanted to say hi.${ctx.shared_interest ? ` I noticed we're both interested in ${ctx.shared_interest}.` : ''} I'd love to learn more about what the ${ctx.role} role looks like day to day.`,
  ctx => `Hi there! I matched with ${ctx.company}${(ctx.growth_cagr_pct!=null && ctx.growth_cagr_pct>0) ? ` and saw you all are growing quickly (${ctx.growth_cagr_pct}% hiring growth)` : ''} — I'd love to hear more about the ${ctx.role} role when you have a few minutes.`,
  ctx => `Hi! ${ctx.company} really caught my eye —${ctx.one_liner ? ` ${ctx.one_liner}` : ' the work you all are doing'} sounds genuinely interesting. Is there someone I could connect with about the ${ctx.role} opening?`,
  ctx => `Hello! I matched with ${ctx.company} and wanted to introduce myself. I'm interested in ${ctx.industry || 'what your team does'}, and the ${ctx.role} role looks like a great fit — would you be open to a quick chat?`,
  ctx => `Hi! I just matched with you all — the ${ctx.role} role at ${ctx.company} looks really interesting.${ctx.city ? ` I didn't realize you were based in ${ctx.city}.` : ''} What's the team like day to day?`,
];

function fallbackOpener(context){
  const idx = Math.floor(Math.random() * OPENER_TEMPLATES.length);
  let msg = OPENER_TEMPLATES[idx](context);
  return msg.charAt(0).toUpperCase() + msg.slice(1);
}

function buildOpenerContext(card){
  const c = card.company;
  const shared = sharedBadges(card)[0] || null;
  const vibe = vibeCompat(c);
  return {
    company: c.name,
    role: card.role,
    city: c.city,
    industry: (c.industries||[])[0] || null,
    one_liner: c.plain_desc || c.description || '',
    growth_cagr_pct: c.employee_cagr!=null ? Math.round(c.employee_cagr*100) : null,
    shared_interest: shared,
    vibe_sign: vibe ? vibe.sign.name : null,
  };
}

async function draftOpener(card){
  const context = buildOpenerContext(card);
  try{
    return await draftOpenerViaAPI(context);
  }catch(e){
    return fallbackOpener(context);
  }
}

function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject)=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      resolve();
    }catch(err){ reject(err); }
  });
}
async function loadOpener(id, card){
  const textEl = document.getElementById(id+'-text');
  const copyBtn = document.getElementById(id+'-copy');
  const regenBtn = document.getElementById(id+'-regen');
  if(!textEl) return;
  textEl.classList.add('loading');
  textEl.textContent = 'Writing something…';
  copyBtn.classList.remove('copied');
  copyBtn.textContent = 'Copy message';
  const msg = await draftOpener(card);
  // guard against the sheet/overlay having been closed & re-opened for a
  // different card while this was in flight
  if(!document.getElementById(id+'-text')) return;
  textEl.classList.remove('loading');
  textEl.textContent = msg;
  copyBtn.onclick = ()=>{
    copyToClipboard(msg).then(()=>{
      copyBtn.classList.add('copied');
      copyBtn.textContent = '✓ Copied';
      setTimeout(()=>{ copyBtn.classList.remove('copied'); copyBtn.textContent='Copy message'; }, 1600);
    }).catch(()=> showToast('Could not copy — select the text manually'));
  };
  regenBtn.onclick = ()=> loadOpener(id, card);
}

/* ---------- distance ---------- */
function distanceFor(c){
  const origin = userLoc || BUFFALO;
  return haversine(origin.lat, origin.lon, c.lat, c.lon);
}

/* ---------- filtering / sorting ---------- */
function applyFilters(){
  let list = CARDS.filter(card=>{
    const c = card.company;
    if(activeIndustry && !(c.industries||[]).includes(activeIndustry)) return false;
    if(distanceFor(c) > filterState.maxDistance) return false;
    if((c.employee_cagr ?? -1) < filterState.minGrowth) return false;
    if(searchTerm){
      const hay = [c.name, card.role, ...(c.tags||[]), ...(c.industries||[])].join(' ').toLowerCase();
      if(!hay.includes(searchTerm.toLowerCase())) return false;
    }
    return true;
  });
  if(activeSort==='dist'){
    list.sort((a,b)=>distanceFor(a.company)-distanceFor(b.company));
  } else if(activeSort==='growth'){
    list.sort((a,b)=>(b.company.employee_cagr??-99)-(a.company.employee_cagr??-99));
  } else if(activeSort==='new'){
    list.sort((a,b)=>(b.company.launch_year??0)-(a.company.launch_year??0));
  } else {
    // recommended: blend growth + a stable shuffle by id
    list.sort((a,b)=>{
      const ga=(a.company.employee_cagr??0), gb=(b.company.employee_cagr??0);
      return (gb*0.6 + (b.company.id%97)*0.001) - (ga*0.6 + (a.company.id%97)*0.001);
    });
  }
  filtered = list;
  deckIndex = 0;
  swipeHistory = [];
  if(discoverDisplayMode === 'feed'){ renderFeed(); } else { renderDeck(); }
}

/* ---------- drag / swipe ---------- */
function attachDrag(){
  const deck = document.getElementById('deck');
  const cards = deck.querySelectorAll('.card');
  const top = cards[cards.length-1];
  if(!top) return;
  top.style.zIndex = 10;
  let startX=0, startY=0, curX=0, curY=0, dragging=false;

  top.addEventListener('click', (e)=>{
    if(Math.abs(curX) < 6){ openProfile(filtered[deckIndex]); }
  });

  function onDown(e){
    dragging = true;
    const p = e.touches? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY; curX=0; curY=0;
    top.style.transition='none';
    top.style.cursor='grabbing';
  }
  function onMove(e){
    if(!dragging) return;
    const p = e.touches? e.touches[0] : e;
    curX = p.clientX - startX;
    curY = p.clientY - startY;
    const rot = curX/18;
    top.style.transform = `translate(${curX}px, ${curY}px) rotate(${rot}deg)`;
    const saveStamp = top.querySelector('.stamp.save');
    const passStamp = top.querySelector('.stamp.pass');
    saveStamp.style.opacity = Math.max(0, Math.min(1, curX/80));
    passStamp.style.opacity = Math.max(0, Math.min(1, -curX/80));
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    top.style.transition='transform .3s ease';
    top.style.cursor='grab';
    if(curX > 110){
      swipeAway(top, 1);
    } else if(curX < -110){
      swipeAway(top, -1);
    } else {
      top.style.transform='translate(0,0) rotate(0)';
      top.querySelector('.stamp.save').style.opacity=0;
      top.querySelector('.stamp.pass').style.opacity=0;
    }
  }
  top.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  top.addEventListener('touchstart', onDown, {passive:true});
  top.addEventListener('touchmove', onMove, {passive:true});
  top.addEventListener('touchend', onUp);
}

let swipeHistory = [];

function swipeAway(el, dir){
  const card = filtered[deckIndex];
  el.style.transform = `translate(${dir*600}px, -40px) rotate(${dir*30}deg)`;
  el.style.opacity = '0';
  swipeHistory.push({card, dir});
  if(dir>0){ doSave(card, true); } else { showToast('Passed on '+card.company.name); }
  setTimeout(()=>{ deckIndex++; renderDeck(); }, 260);
}

function updateUndoBtn(){
  const btn = document.getElementById('undoBtn');
  if(!btn) return;
  btn.classList.toggle('active', swipeHistory.length>0);
}
document.getElementById('undoBtn').onclick = ()=>{
  if(!swipeHistory.length) return;
  const last = swipeHistory.pop();
  if(last.dir>0){ savedKeys.delete(last.card.key); persistSaved(); renderSavedCount(); renderDrawer(); }
  deckIndex = Math.max(0, deckIndex-1);
  renderDeck();
  showToast('Rewound — '+last.card.company.name+' is back');
};

  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0]);
})();

async function loadProfile(){
  try{
    const res = await window.storage.get('elevator:profile', false);
    if(res && res.value){ userProfile = Object.assign(userProfile, JSON.parse(res.value)); }
  }catch(e){ /* first visit — defaults stand */ }
  showOnboardEditor = !userProfile.onboarded;
}
async function saveProfile(){
  try{ await window.storage.set('elevator:profile', JSON.stringify(userProfile), false); }
  catch(e){ /* storage unavailable, profile stays in memory for this session */ }
}
async function loadLastMode(){
  try{
    const res = await window.storage.get('elevator:lastMode', false);
    if(res && res.value) return res.value;
  }catch(e){ /* no prior visit */ }
  return null;
}
async function saveLastMode(mode){
  try{ await window.storage.set('elevator:lastMode', mode, false); }catch(e){}
}

/* ---------- recommendation scoring (no prompt needed — inferred from taps + location) ---------- */
function scoreCard(card){
  const c = card.company;
  let score = 0;
  if(userProfile.interests.length){
    const overlap = (c.industries||[]).filter(i=>userProfile.interests.includes(i)).length;
    score += overlap * 4;
  }
  if(userProfile.stage === 'early'){
    if((c.age_years||99) <= 6) score += 2.5;
  } else if(userProfile.stage === 'growth'){
    if((c.employee_cagr||0) > 0.1) score += 2.5;
  }
  const dist = distanceFor(c);
  if(userProfile.distancePref === 'nearby'){
    score += Math.max(0, 3 - dist/15);
  } else {
    score += Math.max(0, 1.5 - dist/60);
  }
  score += (c.employee_cagr||0) * 1.5;
  // Small, deliberately capped nudge from the "vibe check" — flavor only,
  // never enough to outweigh real signals above.
  if(userProfile.zodiac){
    const v = vibeCompat(c);
    if(v) score += (v.pct/100) * 1.1;
  }
  return score;
}

/* ---------- COMPANY VIEW ---------- */
function jaccardOverlap(a, b){
  if(!a || !b || !a.length || !b.length) return [];
  const setB = new Set(b.map(x=>x.toLowerCase()));
  return a.filter(x=>setB.has(x.toLowerCase()));
}
function computePartners(company){
  const results = [];
  COMPANIES.forEach(other=>{
    if(other.id===company.id) return;
    let score = 0; const reasons = [];
    const sharedInd = jaccardOverlap(company.industries, other.industries);
    if(sharedInd.length){ score += 3*sharedInd.length; reasons.push('Same industry: '+sharedInd[0]); }
    const sharedTags = jaccardOverlap(company.tags, other.tags);
    if(sharedTags.length){ score += sharedTags.length; reasons.push(sharedTags.length+' shared focus tags'); }
    const sharedTech = jaccardOverlap(company.technologies, other.technologies);
    if(sharedTech.length){ score += 2*sharedTech.length; reasons.push('Compatible tech: '+sharedTech[0]); }
    const sharedInvestors = jaccardOverlap(company.investors, other.investors);
    if(sharedInvestors.length){ score += 4; reasons.push('Shared investor: '+sharedInvestors[0]); }
    if(company.client_focus && company.client_focus===other.client_focus){ score += 0.5; }
    const dist = haversine(company.lat, company.lon, other.lat, other.lon);
    score += Math.max(0, 2 - dist/25);
    if(score>0) results.push({other, score, reasons, dist});
  });
  results.sort((a,b)=>b.score-a.score);
  return results.slice(0,6);
}

    </div>

    <div class="rail-head"><h3>Startups ${esc(company.name)} could benefit from</h3></div>
    <div class="sub" style="display:block; margin:-4px 0 12px; font-size:11.5px; color:var(--muted);">Ranked by shared industries, tech, and investors — not a search</div>
    ${partners.length ? partners.map(p=>`
      <div class="partner-card" data-id="${p.other.id}">
        <div class="pc-logo">${logoOrFallback(p.other)}</div>
        <div>
          <div class="pc-name">${esc(p.other.name)}</div>
          <div class="pc-desc">${esc(p.other.plain_desc || p.other.description || '')}</div>
          <div class="pc-reasons">${p.reasons.slice(0,3).map(r=>`<div class="reasonchip">${esc(r)}</div>`).join('')}</div>
        </div>
      </div>`).join('') : `<div class="company-empty"><div>No strong partner signals yet for this company in the current dataset.</div></div>`}
  `;

  document.getElementById('switchToLandingCo').addEventListener('click', showLanding);
  document.getElementById('changeCompanyBtn').addEventListener('click', ()=>{
    selectedCompanyId = null;
    renderCompanyView();
  });
  el.querySelectorAll('.partner-card').forEach(row=>{
    row.addEventListener('click', ()=>{
      const other = COMPANIES.find(c=>c.id===Number(row.dataset.id));
      if(other){
        const pseudoCard = CARDS.find(cd=>cd.company.id===other.id) || {key:'view-'+other.id, company: other, role: (other.roles&&other.roles[0])||'Open role'};
        openProfile(pseudoCard);
      }
    });
  });
  const input = document.getElementById('companySearchInput');
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    const box = document.getElementById('companyAutocomplete');
    if(!q){ box.innerHTML=''; box.classList.remove('autocomplete'); return; }
    const matches = COMPANIES.filter(c=>c.name.toLowerCase().includes(q)).slice(0,8);
    box.classList.add('autocomplete');
    box.innerHTML = matches.map(c=>`
      <div class="ac-row" data-id="${c.id}">
        <div class="acl">${logoOrFallback(c)}</div>
        <div><div class="acn">${esc(c.name)}</div><div class="aci">${esc((c.industries||[])[0]||'')}</div></div>
      </div>`).join('');
    box.querySelectorAll('.ac-row[data-id]').forEach(row=>{
      row.addEventListener('click', ()=>{
        selectedCompanyId = Number(row.dataset.id);
        renderCompanyView();
      });
    });
  });
}

/* ---------- init ---------- */
renderStats();
renderChips();
loadSaved().then(()=>applyFilters());
loadProfile().then(async ()=>{
  const last = await loadLastMode();
  if(last === 'seeker' || last === 'company'){
    setMode(last);
  } else {
    renderLanding();
  }
});
</script>
</body>
</html>
